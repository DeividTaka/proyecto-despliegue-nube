<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderFlow Cloud | Sistema de Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">
    <div class="max-w-2xl w-full bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
        <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">OrderFlow Cloud</h1>
                <p class="text-sm text-slate-400">Infraestructura Alta Disponibilidad en la Nube</p>
            </div>
            <span id="badge-nodo" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-mono px-3 py-1.5 rounded-full">
                Conectando...
            </span>
        </div>

        <form id="form-tarea" class="flex gap-3 mb-6">
            <input type="text" id="input-titulo" required placeholder="Ej. Procesar orden #1045..."
                class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-sky-400">
            <button type="submit"
                class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-semibold px-5 py-2 rounded-lg transition">
                Registrar
            </button>
        </form>

        <h2 class="text-sm uppercase tracking-wider text-slate-400 font-semibold mb-3">Registros en Base de Datos</h2>
        <ul id="lista-tareas" class="space-y-2"></ul>
    </div>

    <script>
        async function cargarEstado() {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('badge-nodo').textContent = `Nodo: ${data.servidor_contenedor}`;
        }

        async function cargarTareas() {
            const res = await fetch('/api/tareas');
            const tareas = await res.json();
            const lista = document.getElementById('lista-tareas');
            lista.innerHTML = tareas.map(t => `
                <li class="bg-slate-900/80 border border-slate-700/80 rounded-lg px-4 py-3 flex justify-between items-center">
                    <span>${t.titulo}</span>
                    <span class="text-xs font-mono text-slate-500">ID #${t.id}</span>
                </li>
            `).join('');
        }

        document.getElementById('form-tarea').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-titulo');
            await fetch('/api/tareas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo: input.value })
            });
            input.value = '';
            cargarEstado();
            cargarTareas();
        });

        cargarEstado();
        cargarTareas();
    </script>
</body>
</html>
