services:
  app1:
    build: .
    environment:
      - DATABASE_URL=postgres://admin:secreto123@db:5432/proyectodb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_interna

  app2:
    build: .
    environment:
      - DATABASE_URL=postgres://admin:secreto123@db:5432/proyectodb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_interna

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secreto123
      POSTGRES_DB: proyectodb
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d proyectodb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red_interna

  loadbalancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - red_interna

volumes:
  datos_postgres:

networks:
  red_interna:
    driver: bridge